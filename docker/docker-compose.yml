services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: "controller"
      MATRIX_CONFIG: "configs/main.json"
      MATRIX_OUT: "results/docker/main.csv"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ../results:/app/results
  node0:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: node
      NODE_ID: "0"
      CONTROLLER_URL: http://controller:8000
      NODE_PORT: "8100"
    depends_on:
      - controller
