services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: "controller"
      MATRIX_CONFIG: "configs/tiny.json"
      MATRIX_OUT: "results/docker/tiny.csv"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ../results:/app/results
  node0:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: node
      NODE_ID: "0"
      CONTROLLER_URL: http://controller:8000
    depends_on:
      - controller
