services:
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: "controller"
      N_HONEST: "15"
      BETA: "0.3"
      ROUNDS: "50"
      SEED: "42"
      WARMUP: "10"
      PEER_SET_SIZE: "7"
      STRATEGY: "eclipse_resistant"
      AGGREGATION: "trimmed_mean"
      BYZANTINE_PROFILE: "coordinated"
      COORDINATED_VALUE: "1000.0"
      POW_BITS: "12"
      NUM_BUCKETS: "8"
      TIMEOUT_ROUNDS: "3"
      TRIM_ALPHA: "0.2"
      FLOODING: "0"
      CHURN_PERIOD: "0"
      UNRESPONSIVE_P: "0.0"
      SELECTIVE_P: "1.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
  node0:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: node
      NODE_ID: "0"
      CONTROLLER_URL: http://controller:8000
    depends_on:
      - controller
  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ROLE: node
      NODE_ID: "1"
      CONTROLLER_URL: http://controller:8000
